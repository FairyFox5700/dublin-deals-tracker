[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dublin-deals-tracker"
version = "0.1.0"
description = "Find and rank free trials and sub-€25 Dublin activities."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Iryna Tyshchenko"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.scripts]
dublin-deals = "dublin_deals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
